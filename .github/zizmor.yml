# Read by the zizmor scan in .github/workflows/scan.yml.
rules:
  dangerous-triggers:
    ignore:
      # workflow_run: these two run the tests against the default branch's own
      # code. They never check out the ref of the run that triggered them.
      - compatibility-test.yml
      - compiler-extracted.yml
      # workflow_run: reads run metadata only, to open an issue.
      - notify-failed-scheduled.yml
      # workflow_run: posts test results with a write token. It only reads
      # data artifacts and never executes code from the triggering run.
      - publish-test-results.yml
      # pull_request_target: assigns a reviewer to Dependabot PRs. It checks
      # out only .github from the base branch, never the PR's code.
      - rotate-dependabot-reviewer.yml
  unpinned-images:
    ignore:
      # Generated by cargo-dist; the container image comes from its build matrix.
      - compact-release.yml
