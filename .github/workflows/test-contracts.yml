name: Test Contracts

on:
  workflow_dispatch:
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-contracts:
    name: Run test-contracts fixtures
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout compactc repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Nix with cache
        uses: ./.github/actions/setup-nix-cache
        with:
          attic_token: ${{ secrets.ATTIC_CACHE_TOKEN }}

      # test.sh builds test-contracts/tools/verify-proof-fixtures, which proves
      # the inner statements the verifyProof fixtures verify.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable (branch)

      - name: Cache Cargo registry and git trees
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('test-contracts/tools/verify-proof-fixtures/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Realize runtime from cache
        run: nix build --no-link .#runtime.package

      - name: Test contracts
        run: ./test-contracts/test.sh
