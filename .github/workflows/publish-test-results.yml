# Publishes test results from build workflows as PR comments and check runs.
#
# This is a separate workflow because fork PRs run with a read-only
# GITHUB_TOKEN, which prevents the build workflow from posting comments
# or creating check runs. By using the workflow_run trigger, this workflow
# runs from the default branch with write permissions while never executing
# untrusted fork code (it only processes data artifacts).
#
# See: https://securitylab.github.com/resources/github-actions-preventing-pwn-requests/
name: Publish Test Results

on:
  workflow_run:
    workflows: ["Compiler Build", "Compiler extracted", "VSC Plugin Build", "Run compatibility tests"]
    types:
      - completed

permissions: {}

jobs:
  publish-results:
    name: Publish test results
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
      actions: read
    if: github.event.workflow_run.conclusion != 'cancelled'
    steps:
      - name: Download JUnit test results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: test-results-junit-summary
          path: artifacts/junit
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download CTRF test results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: github.event.workflow_run.name != 'VSC Plugin Build' && github.event.workflow_run.name != 'Run compatibility tests'
        with:
          name: test-results-ctrf-summary
          path: artifacts/ctrf
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download event file
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: event-file
          path: artifacts/event
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set check names
        id: names
        env:
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
        run: |
          case "$WORKFLOW_NAME" in
            "VSC Plugin Build")
              echo "report_name=Plugin Test Report" >> "$GITHUB_OUTPUT"
              echo "summary_name=Plugin Test Summary" >> "$GITHUB_OUTPUT"
              ;;
            "Run compatibility tests")
              echo "report_name=Compatibility Test Report" >> "$GITHUB_OUTPUT"
              echo "summary_name=Compatibility Test Summary" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "report_name=Compactc E2E Test Report" >> "$GITHUB_OUTPUT"
              echo "summary_name=Compactc E2E Test Summary" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Initialize git repository
        run: git init

      # dorny/test-reporter: Creates a GitHub check run with a detailed,
      # browsable report of individual test cases from JUnit XML.
      - name: Publish Test Report
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: ${{ steps.names.outputs.report_name }}
          path: artifacts/junit/test-report.xml
          reporter: jest-junit

      # EnricoMi/publish-unit-test-result-action: Creates a check run and
      # posts a PR comment with aggregated test counts (pass/fail/skip).
      # The commit, event_file, and event_name inputs are required for
      # workflow_run to associate results with the correct PR.
      - name: Publish Test Summary
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
        with:
          check_name: ${{ steps.names.outputs.summary_name }}
          files: artifacts/junit/test-report.xml
          commit: ${{ github.event.workflow_run.head_sha }}
          event_file: artifacts/event/event.json
          event_name: ${{ github.event.workflow_run.event }}

      # ctrf-io/github-test-reporter: Posts a CTRF-format test summary to the
      # Actions run and as a PR comment. Only compactc workflows produce
      # CTRF reports.
      #
      # This run's own event is workflow_run, so it has to find the pull request
      # itself. The event file is an artifact of the triggering run, which a
      # fork PR controls, so it is not trusted for this. Only the pull requests
      # GitHub itself attached to the triggering run are: comment when there is
      # exactly one and it is at the tested commit.
      #
      # GitHub attaches none to a run from a fork, so fork PRs get the job
      # summary but no CTRF comment. Matching a fork PR by head repository,
      # branch and commit instead cannot be made reliable: several PRs can
      # share all three.
      - name: Find the pull request for the triggering run
        id: pr
        if: always() && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.name != 'VSC Plugin Build' && github.event.workflow_run.name != 'Run compatibility tests'
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_PRS: ${{ toJSON(github.event.workflow_run.pull_requests) }}
        run: |
          number=$(jq -n -r --arg sha "$HEAD_SHA" --argjson run "${RUN_PRS:-[]}" '
            [($run // [])[] | select(.head.sha == $sha) | .number] as $attached
            | if ($attached | length) == 1 then $attached[0] else empty end')
          if [[ "$number" =~ ^[0-9]+$ ]]; then
            echo "number=$number" >> "$GITHUB_OUTPUT"
          else
            echo "GitHub attached no single pull request at $HEAD_SHA to the triggering run; publishing the job summary only."
          fi

      - name: Publish CTRF Summary
        if: always() && github.event.workflow_run.name != 'VSC Plugin Build' && github.event.workflow_run.name != 'Run compatibility tests'
        uses: ctrf-io/github-test-reporter@7974087018bf4857cf5a9d78723e152038c3fa31 # v1.3.0
        with:
          report-path: artifacts/ctrf/ctrf-report.json
          title: E2E test results
          summary: 'true'
          issue: ${{ steps.pr.outputs.number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
