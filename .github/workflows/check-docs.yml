name: Check documentation versions

on:
  workflow_call:
    inputs:
      branch:
        description: 'Branch to check documentation on'
        required: true
        type: string
    secrets:
      MIDNIGHTCI_PACKAGES_WRITE:
        required: false

permissions: {}

jobs:
  check-docs:
    name: Check if documentation is updated
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout compactc repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch }}

      - name: Check compiler and language versions in internal documentation
        run: |
          shopt -s nullglob
          LEDGER_ADT_DOCS=(doc/ledger-adt-*.mdx)
          if [ "${#LEDGER_ADT_DOCS[@]}" -eq 0 ]; then
            echo "No doc/ledger-adt-<target>.mdx files found"
            exit 1
          fi

          COMPILER_VERSION=$(./scripts/read-version.sh compiler)
          LANGUAGE_VERSION=$(./scripts/read-version.sh language)

          # check every target's ledger ADT documentation
          for DOC in "${LEDGER_ADT_DOCS[@]}"; do
            echo "Checking $DOC"

            # check compiler version
            DOCS_COMPILER=$(grep -oP "compiler version \K[0-9]+\.[0-9]+\.[0-9]+" "$DOC")

            echo "Compiler version: $COMPILER_VERSION"
            echo "Compiler version in docs: $DOCS_COMPILER"

            if [ "$COMPILER_VERSION" != "$DOCS_COMPILER" ]; then
              echo "Compiler version mismatch in $DOC, please update"
              exit 1
            fi

            echo "Compiler versions match"

            # check language version
            DOCS_LANGUAGE=$(grep -oP "language version \K[0-9]+\.[0-9]+\.[0-9]+" "$DOC")

            echo "Language version: $LANGUAGE_VERSION"
            echo "Language version in docs: $DOCS_LANGUAGE"

            if [ "$LANGUAGE_VERSION" != "$DOCS_LANGUAGE" ]; then
              echo "Language versions mismatch in $DOC, please update"
              exit 1
            fi

            echo "Language versions match"
          done
