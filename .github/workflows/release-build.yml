name: Build workflow for release

on:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag'
        required: true
        type: string
      branch:
        description: 'Branch, tag or commit to build'
        required: true
        type: string
      platform:
        description: 'Image with OS to run on'
        required: true
        type: string
      architecture:
        description: 'Processor architecture'
        required: true
        type: string
      artifact:
        description: 'Build artifact'
        required: true
        type: string
      buildCommand:
        description: 'Command to build artifact'
        required: true
        type: string
      skipCache:
        description: 'Skip nix cache'
        required: true
        type: boolean
      include_release_notes:
        description: 'Include release notes in zipped files'
        required: true
        type: boolean
        default: true
      release_notes_file:
        description: 'Path to release notes file'
        required: false
        type: string
        default: ''

permissions: {}

jobs:
  build:
    name: Build compactc binary for specific system
    runs-on: ${{ inputs.platform }}
    permissions:
      contents: read
    steps:
      - name: Set name of artifact
        env:
          TAG: ${{ inputs.tag }}
          ARCH: ${{ inputs.architecture }}
        run: |
          echo "ARTIFACT_NAME=compactc_${TAG}_${ARCH}" >> "$GITHUB_ENV"

      - name: Checkout compactc repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch }}

      - name: Setup Nix with cache
        uses: ./.github/actions/setup-nix-cache
        with:
          skip_cache: ${{ inputs.skipCache }}
          attic_token: ${{ secrets.ATTIC_CACHE_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          always-auth: true
          registry-url: https://npm.pkg.github.com/
          scope: '@midnight-ntwrk'
          node-version-file: '.nvmrc'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.MIDNIGHTCI_PACKAGES_WRITE }}

      - name: Record the release in the compiler version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          EXPECTED="$(./scripts/stamp-compiler-version.sh \
            "$TAG" \
            "$(git rev-parse HEAD)" \
            "$(git show -s --format=%cs HEAD)")"
          echo "EXPECTED_COMPILER_VERSION=$EXPECTED" >> "$GITHUB_ENV"

      - name: Create binary for specific system
        run: |
          ${{ inputs.buildCommand }}
          if [ "${{ inputs.include_release_notes }}" = "true" ] && [ -n "${{ inputs.release_notes_file }}" ]; then
            if [ -f "${{ inputs.release_notes_file }}" ]; then
              zip --junk-paths ${{ env.ARTIFACT_NAME }}.zip result/**/** "${{ inputs.release_notes_file }}"
            else
              echo "::error::Release notes file not found: ${{ inputs.release_notes_file }}"
              exit 1
            fi
          else
            zip --junk-paths ${{ env.ARTIFACT_NAME }}.zip result/**/**
          fi

      - name: Check the built compiler reports the stamped version
        run: |
          # The stamp edits a tracked file after checkout and the build reads the
          # working tree, so nothing else here proves the build picked it up -- every
          # step would pass and ship an unstamped binary. Checked against the zip, so
          # what is checked is what ships.
          tmp="$(mktemp -d)"
          unzip -q "${ARTIFACT_NAME}.zip" -d "$tmp"
          chmod +x "$tmp"/* || true
          got="$("$tmp/compactc" --version)"
          if [ "$got" != "$EXPECTED_COMPILER_VERSION" ]; then
            echo "::error::built compiler reports '$got', expected '$EXPECTED_COMPILER_VERSION'"
            exit 1
          fi
          echo "compactc --version -> $got"

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact }}
          path: ${{ env.ARTIFACT_NAME }}.zip
          if-no-files-found: error
