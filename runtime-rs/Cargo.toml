[workspace]
resolver = "3"
members = [
    ".",
    "../runtime-rs-macros",
]

[workspace.dependencies]
# Pinned to the same midnight-ledger line the TS runtime uses
# (ledger-9.1.0.0-rc.3 per flake.nix). The ledger-9 crate line
# (transient-crypto 3, coin-structure 3, onchain-* 4, zswap 9) is not yet
# published to crates.io, so these are git dependencies on the release tag;
# switch back to registry versions once ledger 9 is published.
midnight-base-crypto      = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "ledger-9.1.0.0-rc.3" }
midnight-transient-crypto = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "ledger-9.1.0.0-rc.3" }
midnight-serialize        = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "ledger-9.1.0.0-rc.3" }
midnight-storage          = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "ledger-9.1.0.0-rc.3" }
midnight-coin-structure   = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "ledger-9.1.0.0-rc.3" }
midnight-onchain-state    = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "ledger-9.1.0.0-rc.3" }
midnight-onchain-vm       = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "ledger-9.1.0.0-rc.3" }
midnight-onchain-runtime  = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "ledger-9.1.0.0-rc.3" }
# default-features = false drops zswap's `proof-verifying` feature (zkir_v2),
# which requires a midnight-transient-crypto ^2.2.0 that is not on crates.io.
# midnight-compact-runtime only uses zswap::local state tracking, never proof checks.
midnight-zswap            = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "ledger-9.1.0.0-rc.3", default-features = false }

# Mirror midnight-ledger's own [patch.crates-io] (git-sourced instead of
# path-sourced): ledger-9 crates depend on an "old" registry
# midnight-transient-crypto (>=2.2 for zkir, >=2.0 for onchain-state) whose
# transitive base-crypto/serialize must unify with the ledger-9 copies, and
# 2.2.0 is only available as a git tag. Drop this section once the ledger-9
# line is published to crates.io.

[patch.crates-io]
midnight-base-crypto      = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "ledger-9.1.0.0-rc.3" }
midnight-serialize        = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "ledger-9.1.0.0-rc.3" }
midnight-transient-crypto = { git = "https://github.com/midnightntwrk/midnight-ledger", tag = "transient-crypto-2.2.0-rc.1" }

[package]
name          = "midnight-compact-runtime"
version       = "0.19.100"
edition       = "2021"
license       = "Apache-2.0"
description   = "Native Rust runtime facade for code generated by compactc --rust. Mirrors @midnight-ntwrk/compact-runtime."
repository    = "https://github.com/LFDT-Minokawa/compact"
homepage      = "https://github.com/LFDT-Minokawa/compact"
documentation = "https://docs.rs/midnight-compact-runtime"
readme        = "README.md"

# Not publishable yet, and this is a statement of fact rather than a policy.
# `cargo publish` refuses a git dependency with no `version`, and the
# midnight-ledger crates this is built on are not on crates.io for the
# ledger-9 line — which is the same reason the `[patch.crates-io]` section
# below has to exist. The publish metadata above is deliberately complete so
# that flipping this is the only change needed once they are published; drop
# this line at the same time as that patch section.
publish       = false
keywords      = ["compact", "midnight", "compactc", "zk", "blockchain"]
categories    = ["cryptography::cryptocurrencies", "compilers"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "midnight_compact_runtime"
path = "src/lib.rs"

[dependencies]
midnight-base-crypto      = { workspace = true }
midnight-transient-crypto = { workspace = true }
midnight-onchain-state    = { workspace = true }
midnight-onchain-vm       = { workspace = true }
midnight-onchain-runtime  = { workspace = true }
midnight-coin-structure   = { workspace = true }
midnight-zswap            = { workspace = true }
midnight-serialize        = { workspace = true }
midnight-storage          = { workspace = true }
# `version = "=0.19.100"` is required for `cargo publish` to accept this
# manifest — crates.io rejects path-only dependencies. The `=` pin keeps
# the two crates lock-stepped: bumping `midnight-compact-runtime` to 0.18.108 must
# also bump `midnight-compact-runtime-macros` to 0.18.108. See
# docs/superpowers/notes/2026-06-02-crates-io-publication-plan.md.
midnight-compact-runtime-macros    = { path = "../runtime-rs-macros", version = "=0.19.100" }
