[package]
name = "compact"
version = { workspace = true }
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
description = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
license = { workspace = true }

[dependencies]
anyhow = "1.0.94"
axoupdater = { version = "0.10.3", default-features = false, features = [
  "github_releases",
] }
bytes = "1.11.1"
clap = { version = "4.5.23", features = ["derive", "env", "wrap_help"] }
console = "0.16.0"
dialoguer = "0.12.0"
dirs = "7.0.0"
futures = "0.3.31"
ignore = "0.4.23"
indicatif = "0.18.0"
regex = "1.11.1"
reqwest = { version = "0.12.9", default-features = false, features = [
  "gzip",
  "json",
  "rustls-tls",
  "stream",
] }
semver = { version = "1.0.24", features = ["serde"] }
serde = { version = "1.0.216", features = ["derive"] }
serde_json = "1.0.133"
sha2 = "0.11.1"
similar = "3.2.1"
tempfile = "3.20.0"
tokio = { version = "1.42.0", features = ["full", "macros"] }
# Named in the code only as `reqwest::Url'. Listed for its `serde' feature,
# with which the cache of the release listing writes and reads archive URLs.
url = { version = "2.5.8", features = ["serde"] }
# Read-only deflate: the launcher never writes an archive, so this avoids the
# compressor and the second inflate backend that the `deflate' feature pulls in.
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
wiremock = "0.6.4"

