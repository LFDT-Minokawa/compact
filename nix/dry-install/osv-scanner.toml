# Read by osv-scanner in .github/workflows/scan.yml. Applies to the
# package-lock.json in this directory only.
#
# minimatch@9.0.3 is pinned exactly by @typescript-eslint/typescript-estree@6,
# which eslint-config-standard-with-typescript@43 pulls in. It is a lint-time
# dev dependency: the globs it matches come from our own eslint config, never
# from untrusted input, so the ReDoS issues below are not reachable. Remove
# these entries once the eslint config is replaced or upgraded.

[[IgnoredVulns]]
id = "CVE-2026-26996"
ignoreUntil = 2027-03-01
reason = "minimatch ReDoS; lint-time dev dependency, patterns are not attacker-controlled"

[[IgnoredVulns]]
id = "CVE-2026-27903"
ignoreUntil = 2027-03-01
reason = "minimatch ReDoS; lint-time dev dependency, patterns are not attacker-controlled"

[[IgnoredVulns]]
id = "CVE-2026-27904"
ignoreUntil = 2027-03-01
reason = "minimatch ReDoS; lint-time dev dependency, patterns are not attacker-controlled"
